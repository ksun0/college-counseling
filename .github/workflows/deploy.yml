name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site bundle
        run: |
          mkdir -p site/index-english site/index-chinese site/dec-2025-early-application-reflection site/two-case-studies-shenzhen
          cp index.html site/
          cp index-english.html site/
          cp index-chinese.html site/
          cp audio.html site/
          cp dec-2025-early-application-reflection.html site/
          cp two-case-studies-shenzhen.html site/
          cp *.txt site/ 2>/dev/null || true
          cp Emma.jpeg site/
          cp -R assets site/
          cp -R audio site/
          cp -R images site/
          cp index-english.html site/index-english/index.html
          cp index.html site/index-chinese/index.html
          cp audio.html site/audio/index.html
          sed -i '0,/<head>/s|<head>|<head>\n    <base href="../" />|' site/audio/index.html
          cp dec-2025-early-application-reflection.html site/dec-2025-early-application-reflection/index.html
          cp two-case-studies-shenzhen.html site/two-case-studies-shenzhen/index.html
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload Firebase artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-site
          path: site

  deploy-github-pages:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-firebase:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download prepared site artifact
        uses: actions/download-artifact@v4
        with:
          name: firebase-site
          path: site

      - name: Write Firebase Hosting config for CI
        run: |
          cat > site/firebase.json <<'EOF'
          {
            "hosting": {
              "site": "bingjincounseling",
              "public": ".",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**",
                "*service-account*.json",
                "*firebase-adminsdk*.json",
                "college-counseling-1182b-*.json"
              ],
              "cleanUrls": false,
              "trailingSlash": false,
              "rewrites": [
                {
                  "source": "/audio",
                  "destination": "/audio.html"
                },
                {
                  "source": "/",
                  "destination": "/index.html"
                }
              ]
            }
          }
          EOF

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLLEGE_COUNSELING_1182B }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_COLLEGE_COUNSELING_1182B repository secret."
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        working-directory: site
        run: |
          set +e
          firebase deploy --only hosting --project college-counseling-1182b 2>&1 | tee "$RUNNER_TEMP/firebase-deploy.log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "is the current active version" "$RUNNER_TEMP/firebase-deploy.log"; then
            echo "Firebase Hosting already has this version active; treating deploy as successful."
            exit 0
          fi

          exit "$status"
